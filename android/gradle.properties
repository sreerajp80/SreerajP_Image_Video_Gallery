# JVM settings for the Gradle daemon
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError

# AndroidX is required by the Flutter embedding and by androidx.core helpers
# used in the MediaStore channel.
android.useAndroidX=true
android.enableJetifier=false

# Every --split-per-abi APK gets the same versionCode as the Play bundle (the
# build number in pubspec.yaml). Without this, Flutter adds 1000/2000/4000 per
# ABI, so a phone with a direct APK (e.g. 1034) sees Play's build (e.g. 37) as
# older and can never update from Play. Flutter 3.50.1 has this switch; a
# Flutter version without it ignores it silently. See docs/release_process.md section 12.
force-version-code-ignoring-abi=true

# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
