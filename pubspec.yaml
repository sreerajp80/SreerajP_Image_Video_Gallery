name: in_sreerajp_imgvidgal
description: "Offline-first image and video gallery application for viewing, organizing, and managing local media."
publish_to: 'none'
version: 2.6.5+23

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  # Material and Cupertino as packages, not the frozen SDK copies (engineering
  # standard 6.1, G22). go_router 18 builds its pages with material_ui, so the
  # app must use the same library. cupertino_ui is needed for the Sanskrit
  # fallback delegates.
  material_ui: ^1.9.0
  cupertino_ui: ^1.1.5
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  sqflite: ^2.3.3+3
  path: ^1.9.0
  path_provider: ^2.1.4
  system_info2: ^4.0.0
  # SHA-256 and HMAC for transfer keys and hashing. Pinned exactly: a
  # security package changes only by a deliberate, reviewed edit (G39).
  crypto: 3.0.8
  image: ^4.2.0
  video_player: ^2.9.1
  pdf: ^3.11.1
  local_auth: ^3.0.2
  local_auth_android: ^2.3.0
  # Vault PIN hash, salt and settings. Pinned exactly (security package).
  # Version 11 cannot read data written by version 9; that was safe to skip
  # only because no install with a vault existed (owner, 2026-11-02, G49).
  flutter_secure_storage: 11.2.0
  # Phase 11 pairing QR: qr_flutter draws it (BSD-3-Clause).
  qr_flutter: ^4.1.0
  # The live pairing QR scan. Flutter team, BSD-3-Clause; on Android it uses
  # AndroidX CameraX and nothing else (no Play Services, no ML Kit, no http).
  # Decoding is done by ZXing core in Kotlin (BarcodeChannelHandler). This
  # replaced mobile_scanner, which used Google's closed-source ML Kit (G47).
  # Pinned exactly: it feeds untrusted camera frames to the decoder.
  camera: 0.12.2
  # Phase 12 offline OCR. Wraps Tesseract4Android on the Android side.
  # BSD-3-Clause, and its only Dart dependencies are flutter, path and
  # path_provider - no HTTP client. The language files ship as assets in
  # assets/tessdata/ and are never downloaded. ML Kit was not used: it has no
  # Malayalam model, and it is a closed-source binary.
  flutter_tesseract_ocr: ^0.4.31
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.3+1
  # OCR accuracy tool (tool/ocr_eval/): counts Malayalam conjuncts as one
  # character. Already in the lock file through Flutter; listed so the tool
  # may import it.
  characters: ^1.4.1

dependency_overrides:
  # flutter_tesseract_ocr 0.4.31 (its newest release) calls jcenter() in its
  # Android build file, which Gradle 9 removed. The plugin's own repository
  # has the fix but has not released it. Pinned to that exact commit, so the
  # build cannot drift. Same package, same BSD-3-Clause licence. Remove this
  # override once a release after 0.4.31 includes the fix.
  flutter_tesseract_ocr:
    git:
      url: https://github.com/khjde1207/tesseract_ocr.git
      ref: 259994d4d93d755f8d365907df0f3b174f85ff57

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/config/
    - assets/tessdata/
    # The plugin looks for this exact path, so it sits beside the folder
    # rather than inside it.
    - assets/tessdata_config.json
